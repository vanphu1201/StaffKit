[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "auto-prompt-engine"
version = "0.2.0"
description = "Zero-waste, anti-hallucination Auto-Prompt Engine for Antigravity (agy CLI / SDK / MCP)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "fastmcp>=2.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
sdk = [
    "google-antigravity>=0.1",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
engine = "engine.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"
