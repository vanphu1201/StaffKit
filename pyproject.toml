[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "staffkit"
version = "3.1.0"
description = "StaffKit — 0-token Staff-Engineer Plugin for Antigravity IDE (6-tool MCP exoskeleton, 1-hop import + Git Co-Change locator, zero-regression verifier, PR blast-radius review & ADR memory)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "fastmcp>=2.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
staffkit = "engine.cli:app"
engine = "engine.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"
