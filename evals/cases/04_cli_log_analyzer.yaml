id: eval-cli-log-analyzer
title: "Python CLI Log Analyzer (JSON/CSV Output & Malformed Line Resilience)"
domain: cli
blueprint: python_app
prd_markdown: |
  Build a Python CLI tool in `src/log_analyzer.py` invoked via `python -m src.log_analyzer <logfile> [--format json|csv]`.
  Requirements:
  - Input log lines follow `<ISO_TIMESTAMP> <LEVEL> <service>: <message>` where `<LEVEL>` is `INFO`, `WARN`, or `ERROR`.
  - Ignore blank lines cleanly, and count malformed non-blank lines under `skipped_malformed` instead of crashing.
  - When `--format json` (default): print a valid JSON object to stdout containing:
    + `total_valid`: int
    + `skipped_malformed`: int
    + `counts_by_level`: `{"INFO": int, "WARN": int, "ERROR": int}`
    + `top_errors`: list of `[message, count]` ordered descending by count (up to 3 items)
  - When `--format csv`: print valid CSV with header `level,count` and rows for `INFO`, `WARN`, `ERROR`.
  - Exit with code `0` on success and non-zero exit code if `<logfile>` does not exist.
starter_files:
  "src/__init__.py": ""
  "src/log_analyzer.py": |
    """CLI log analyzer entrypoint."""

    import argparse
    import sys


    def main(argv: list[str] | None = None) -> int:
        parser = argparse.ArgumentParser(description="Analyze structured application logs")
        parser.add_argument("logfile")
        parser.add_argument("--format", choices=["json", "csv"], default="json")
        _args = parser.parse_args(argv)
        raise NotImplementedError("Log analyzer not implemented")


    if __name__ == "__main__":
        sys.exit(main())
  "tests/test_public_cli.py": |
    import subprocess
    import sys

    def test_cli_help() -> None:
        proc = subprocess.run([sys.executable, "-m", "src.log_analyzer", "--help"], capture_output=True, text=True)
        assert proc.returncode == 0
public_verify_commands:
  - "{python} -m pytest tests/test_public_cli.py -q"
hidden_files:
  "hidden_tests/test_hidden_cli.py": |
    import csv
    import io
    import json
    import subprocess
    import sys
    from pathlib import Path

    SAMPLE_LOG = "\n".join(
        [
            "2026-11-22T10:00:00Z INFO auth: User login ok",
            "   ",
            "MALFORMED GARBAGE LINE WITHOUT LEVEL",
            "2026-11-22T10:00:02Z ERROR db: Connection timeout",
            "2026-11-22T10:00:03Z WARN cache: Miss ratio high",
            "2026-11-22T10:00:04Z ERROR db: Connection timeout",
            "2026-11-22T10:00:05Z ERROR api: Upstream 502",
        ]
    )

    def test_json_and_csv_and_missing_file(tmp_path: Path) -> None:
        log_file = tmp_path / "app.log"
        log_file.write_text(SAMPLE_LOG, encoding="utf-8")

        res_json = subprocess.run(
            [sys.executable, "-m", "src.log_analyzer", str(log_file), "--format", "json"],
            capture_output=True,
            text=True,
        )
        assert res_json.returncode == 0, res_json.stderr
        data = json.loads(res_json.stdout)
        assert data["total_valid"] == 5
        assert data["skipped_malformed"] == 1
        assert data["counts_by_level"] == {"INFO": 1, "WARN": 1, "ERROR": 3}
        assert data["top_errors"][0][0] == "Connection timeout"
        assert data["top_errors"][0][1] == 2

        res_csv = subprocess.run(
            [sys.executable, "-m", "src.log_analyzer", str(log_file), "--format", "csv"],
            capture_output=True,
            text=True,
        )
        assert res_csv.returncode == 0
        rows = list(csv.reader(io.StringIO(res_csv.stdout)))
        assert rows[0] == ["level", "count"]
        mapping = {r[0]: int(r[1]) for r in rows[1:]}
        assert mapping == {"INFO": 1, "WARN": 1, "ERROR": 3}

        res_missing = subprocess.run(
            [sys.executable, "-m", "src.log_analyzer", str(tmp_path / "nope.log")],
            capture_output=True,
            text=True,
        )
        assert res_missing.returncode != 0
hidden_pass_to_pass_commands:
  - "{python} -m pytest tests/test_public_cli.py -q"
hidden_fail_to_pass_commands:
  - "{python} -m pytest hidden_tests/test_hidden_cli.py -q"
