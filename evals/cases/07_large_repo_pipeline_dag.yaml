id: eval-large-pipeline-dag
title: "Event Ingestion Pipeline with Schema Validation, Retries & Persistent DLQ (15-File Repo)"
domain: data_pipeline
blueprint: python_app
prd_markdown: |
  Upgrade the existing ETL event pipeline without breaking `csv_reader.py`, `json_writer.py`, `normalize.py`, or `state_store.py`:

  ## 1. Schema Validator (`src/core/schema.py`)
  - Implement `SchemaValidator(required_fields: dict[str, type], ranges: dict[str, tuple[float, float]] | None = None)`:
    + `validate(payload: dict) -> tuple[bool, list[str]]`: verify every required key exists (treat `bool` cleanly so `isinstance(True, int)` does not sneak past `int` fields!), check types (`str`, `int`, `float`), and validate inclusive numeric `ranges` when specified.

  ## 2. Persistent Dead-Letter Queue (`src/storage/dlq.py`)
  - Implement `DeadLetterQueue(file_path: str)` storing failed event entries as newline-delimited JSON on disk (`{"event_id": ..., "payload": ..., "error": ..., "attempts": ...}`).
  - Methods: `push(event_id: str, payload: dict, error: str, attempts: int) -> None`, `list_entries() -> list[dict]` (reads from disk cleanly even across fresh `DeadLetterQueue(file_path)` instances!), and `clear() -> int`.

  ## 3. Retry & DLQ Routing (`src/core/pipeline.py`)
  - Implement `Pipeline(validator: SchemaValidator, handler: Callable[[dict], None], dlq: DeadLetterQueue, state_store: StateStore | None = None, max_retries: int = 2)`:
    + `process_batch(records: list[EventRecord]) -> dict`:
      - Validate each `record.payload`; invalid records skip retries immediately and go straight to `dlq` with `attempts=1`.
      - Valid records invoke `handler(payload)`; retry on raised exceptions up to `max_retries` extra attempts (`max_retries + 1` total calls). If all attempts fail, push to `dlq` with actual `attempts`.
      - Advance `state_store` cursor after processed events and return `{"succeeded": int, "failed_validation": int, "failed_execution": int}`.
