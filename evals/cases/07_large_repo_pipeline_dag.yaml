  "tests/__init__.py": ""
  "tests/test_existing_plugins.py": |
    from pathlib import Path
    from src.plugins.csv_reader import parse_csv_rows
    from src.plugins.json_writer import append_jsonl
    from src.plugins.normalize import clean_tag
    from src.storage.state_store import StateStore

    def test_plugins_and_state_store(tmp_path: Path) -> None:
        rows = parse_csv_rows("name,role\nAlice, Admin ")
        assert rows[0]["name"] == "Alice"
        assert clean_tag("  High   Priority ") == "high_priority"
        out = tmp_path / "events.jsonl"
        append_jsonl(out, {"ok": True})
        assert out.is_file()
        st = StateStore()
        st.commit_offset(5)
        assert st.last_offset == 5
