hidden_files:
  "hidden_tests/test_hidden_pipeline.py": |
    from pathlib import Path
    from src.core.pipeline import Pipeline
    from src.core.record import EventRecord
    from src.core.schema import SchemaValidator
    from src.storage.dlq import DeadLetterQueue
    from src.storage.state_store import StateStore

    def test_schema_retry_and_persistent_dlq(tmp_path: Path) -> None:
        dlq_path = str(tmp_path / "dlq" / "failed.jsonl")
        validator = SchemaValidator(
            required_fields={"user_id": str, "amount": int},
            ranges={"amount": (1, 1000)},
        )

        # Reject bool masquerading as int and out-of-range ints
        ok_bool, _ = validator.validate({"user_id": "u1", "amount": True})
        assert ok_bool is False
        ok_range, _ = validator.validate({"user_id": "u1", "amount": 5000})
        assert ok_range is False

        call_counts: dict[str, int] = {}
        processed: list[str] = []

        def flaky_handler(payload: dict) -> None:
            uid = payload["user_id"]
            call_counts[uid] = call_counts.get(uid, 0) + 1
            if uid == "flaky" and call_counts[uid] < 2:
                raise RuntimeError("transient network error")
            if uid == "poison":
                raise RuntimeError("permanent downstream rejection")
            processed.append(uid)

        dlq = DeadLetterQueue(dlq_path)
        state = StateStore()
        pipeline = Pipeline(validator, flaky_handler, dlq, state_store=state, max_retries=2)

        stats = pipeline.process_batch(
            [
                EventRecord("e1", {"user_id": "bad", "amount": -5}, offset=1),
                EventRecord("e2", {"user_id": "flaky", "amount": 50}, offset=2),
                EventRecord("e3", {"user_id": "poison", "amount": 90}, offset=3),
            ]
        )
        assert stats == {"succeeded": 1, "failed_validation": 1, "failed_execution": 1}
        assert processed == ["flaky"]
        assert state.last_offset == 3

        # Fresh DLQ instance verifies real disk persistence
        dlq_reopened = DeadLetterQueue(dlq_path)
        entries = dlq_reopened.list_entries()
        assert len(entries) == 2
        by_id = {e["event_id"]: e for e in entries}
        assert by_id["e1"]["attempts"] == 1
        assert by_id["e3"]["attempts"] == 3
        assert dlq_reopened.clear() == 2
        assert DeadLetterQueue(dlq_path).list_entries() == []
hidden_pass_to_pass_commands:
  - "{python} -m pytest tests/test_existing_plugins.py tests/test_pipeline_public.py -q"
hidden_fail_to_pass_commands:
  - "{python} -m pytest hidden_tests/test_hidden_pipeline.py -q"
