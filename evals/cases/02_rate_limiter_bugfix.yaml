id: eval-rate-limiter
title: "Sliding-Window Rate Limiter Bugfix (with Backward-Compat PASS_TO_PASS)"
domain: backend
blueprint: python_app
prd_markdown: |
  Fix the bugs in `src/limiter.py`:
  1. `SlidingWindowLimiter(max_requests: int, window_seconds: float, clock: Callable[[], float] | None = None)` currently uses a naive counter that never expires timestamps older than `now - window_seconds`.
  2. Replace it with an exact sliding-window log per `key`:
     - Expired entries with `ts <= now - window_seconds` must be purged before checking capacity.
     - Reject when active count in the current window is already `>= max_requests`.
     - If a key becomes empty after purging, remove its bucket so memory does not leak unboundedly.
     - Keep `allow_request(key: str) -> bool` fully backward-compatible when `clock` is omitted (defaulting to `time.monotonic`).
     - Expose `remaining(key: str) -> int` returning remaining quota in `[0, max_requests]`.
starter_files:
  "src/__init__.py": ""
  "src/limiter.py": |
    """Rate limiter module."""

    import time
    from typing import Callable


    class SlidingWindowLimiter:
        def __init__(
            self,
            max_requests: int,
            window_seconds: float,
            clock: Callable[[], float] | None = None,
        ) -> None:
            self.max_requests = max_requests
            self.window_seconds = window_seconds
            self.clock = clock or time.monotonic
            self._counts: dict[str, int] = {}

        def allow_request(self, key: str) -> bool:
            # BUG: never expires old requests!
            cur = self._counts.get(key, 0)
            if cur >= self.max_requests:
                return False
            self._counts[key] = cur + 1
            return True

        def remaining(self, key: str) -> int:
            return max(0, self.max_requests - self._counts.get(key, 0))
  "tests/test_existing_limiter.py": |
    from src.limiter import SlidingWindowLimiter

    def test_existing_basic_limit() -> None:
        lim = SlidingWindowLimiter(max_requests=2, window_seconds=60.0)
        assert lim.allow_request("ip-1") is True
        assert lim.allow_request("ip-1") is True
        assert lim.allow_request("ip-1") is False
        assert lim.allow_request("ip-2") is True
public_verify_commands:
  - "{python} -m pytest tests/test_existing_limiter.py -q"
hidden_files:
  "hidden_tests/test_hidden_limiter.py": |
    from src.limiter import SlidingWindowLimiter

    def test_window_expiry_and_remaining() -> None:
        now = [100.0]
        lim = SlidingWindowLimiter(max_requests=2, window_seconds=10.0, clock=lambda: now[0])

        assert lim.remaining("k1") == 2
        assert lim.allow_request("k1") is True
        now[0] = 104.0
        assert lim.allow_request("k1") is True
        assert lim.remaining("k1") == 0
        assert lim.allow_request("k1") is False

        # At t=110.0, timestamp 100.0 has expired (110.0 - 10.0 = 100.0)
        now[0] = 110.0
        assert lim.remaining("k1") == 1
        assert lim.allow_request("k1") is True
        assert lim.allow_request("k1") is False

        # After full window inactivity, full quota restores cleanly
        now[0] = 125.0
        assert lim.remaining("k1") == 2
hidden_pass_to_pass_commands:
  - "{python} -m pytest tests/test_existing_limiter.py -q"
hidden_fail_to_pass_commands:
  - "{python} -m pytest hidden_tests/test_hidden_limiter.py -q"
