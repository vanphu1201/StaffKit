    from dataclasses import dataclass, field

    @dataclass
    class PlanTier:
        plan_id: str
        base_price_cents: int
        per_seat_cents: int

    @dataclass
    class Subscription:
        sub_id: str
        customer_id: str
        plan_id: str
        seats: int
        status: str = "ACTIVE"
        consecutive_failures: int = 0
        credit_balance_cents: int = 0

    @dataclass
    class Invoice:
        invoice_id: str
        sub_id: str
        subtotal_cents: int
        discount_cents: int
        tax_cents: int
        credit_applied_cents: int
        amount_due_cents: int
        status: str = "OPEN"
        paid_tx_ids: list[str] = field(default_factory=list)
  "src/utils/__init__.py": ""
  "src/utils/validators.py": |
    def require_non_empty(val: str, field_name: str) -> str:
        if not isinstance(val, str) or not val.strip():
            raise ValueError(f"{field_name} must be a non-empty string")
        return val.strip()

    def require_positive_int(val: int, field_name: str) -> int:
        if not isinstance(val, int) or isinstance(val, bool) or val <= 0:
            raise ValueError(f"{field_name} must be > 0")
        return val

    def require_non_negative_int(val: int, field_name: str) -> int:
        if not isinstance(val, int) or isinstance(val, bool) or val < 0:
            raise ValueError(f"{field_name} must be >= 0")
        return val
  "src/utils/currency.py": |
    def format_usd_cents(cents: int) -> str:
        sign = "-" if cents < 0 else ""
        abs_c = abs(cents)
        return f"{sign}${abs_c // 100}.{abs_c % 100:02d}"

    def apply_bps_floor(amount_cents: int, bps: int) -> int:
        return (amount_cents * bps) // 10_000
  "src/auth/__init__.py": ""
  "src/auth/token_guard.py": |
    import hashlib

    def sign_session_token(user_id: str, secret: str) -> str:
        digest = hashlib.sha256(f"{user_id}:{secret}".encode("utf-8")).hexdigest()[:24]
        return f"tok_{user_id}_{digest}"

    def verify_session_token(token: str, user_id: str, secret: str) -> bool:
        return token == sign_session_token(user_id, secret)
