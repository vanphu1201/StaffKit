id: eval-saas-subscription-engine
title: "Enterprise SaaS Subscription, Proration, Ledger & Dunning Engine (18-File Repo)"
domain: product_engineering
blueprint: python_app
prd_markdown: |
  Build the complete Enterprise SaaS Subscription, Mid-Cycle Proration, Invoice Ledger & Dunning Engine across `src/models/subscription.py`, `src/repositories/ledger_repo.py`, and `src/services/subscription_service.py` while keeping all existing auth, analytics, and currency tests (`tests/test_platform_regression.py`) passing.

  ## Architecture & Interface Contract
  - `src/models/subscription.py`:
    + `PlanTier`: dataclass with `plan_id: str`, `base_price_cents: int`, `per_seat_cents: int`.
    + `Subscription`: dataclass with `sub_id: str`, `customer_id: str`, `plan_id: str`, `seats: int`, `status: str = "ACTIVE"`, `consecutive_failures: int = 0`, `credit_balance_cents: int = 0`.
    + `Invoice`: dataclass with `invoice_id: str`, `sub_id: str`, `subtotal_cents: int`, `discount_cents: int`, `tax_cents: int`, `credit_applied_cents: int`, `amount_due_cents: int`, `status: str = "OPEN"`, `paid_tx_ids: list[str] = field(default_factory=list)`.
  - `src/repositories/ledger_repo.py`:
    + `LedgerRepository`: store & retrieve `PlanTier`, `Subscription`, and `Invoice` objects in memory (`save_plan`, `get_plan`, `save_subscription`, `get_subscription`, `save_invoice`, `get_invoice`, `list_invoices_for_sub(sub_id: str) -> list[Invoice]`).
  - `src/services/subscription_service.py` (`SubscriptionService(repo: LedgerRepository | None = None)`):
    + `register_plan(plan_id: str, base_price_cents: int, per_seat_cents: int) -> PlanTier`
    + `create_subscription(sub_id: str, customer_id: str, plan_id: str, seats: int) -> Subscription`
    + `change_plan_prorated(sub_id: str, new_plan_id: str, new_seats: int, days_remaining: int, total_days_in_cycle: int = 30) -> int`:
      * Compute old full-cycle cost = `old_plan.base_price_cents + old_plan.per_seat_cents * old_seats` and new full-cycle cost = `new_plan.base_price_cents + new_plan.per_seat_cents * new_seats`.
      * Prorated delta in integer cents = `((new_cost - old_cost) * days_remaining) // total_days_in_cycle`.
      * Update subscription's `plan_id` and `seats`.
      * If `delta < 0` (downgrade credit), add `abs(delta)` to `sub.credit_balance_cents` and return `delta`. If `delta >= 0`, return `delta`.
    + `generate_invoice(invoice_id: str, sub_id: str, extra_charge_cents: int = 0, discount_bps: int = 0, tax_bps: int = 0) -> Invoice`:
      * Base cycle charge = `plan.base_price_cents + plan.per_seat_cents * sub.seats + extra_charge_cents`.
      * `discount_cents = min(subtotal_cents, (subtotal_cents * discount_bps) // 10_000)`.
      * `taxable_cents = subtotal_cents - discount_cents`.
      * `tax_cents = (taxable_cents * tax_bps) // 10_000`.
      * Gross total = `taxable_cents + tax_cents`.
      * Automatically apply available `sub.credit_balance_cents`: `credit_applied_cents = min(sub.credit_balance_cents, gross_total)`, deduct `credit_applied_cents` from `sub.credit_balance_cents`, and set `amount_due_cents = gross_total - credit_applied_cents`.
      * If `amount_due_cents == 0`, set invoice `status = "PAID"`, else `"OPEN"`.
    + `record_payment(invoice_id: str, tx_id: str) -> Invoice`:
      * Idempotent on `tx_id`: if `tx_id` is already in `invoice.paid_tx_ids` or invoice is already `"PAID"`, return the invoice without error.
      * Mark invoice `status = "PAID"`, append `tx_id` to `paid_tx_ids`, reset subscription `consecutive_failures = 0`, and if subscription status was `"PAST_DUE"` or `"SUSPENDED"`, restore it to `"ACTIVE"`.
    + `record_failed_payment(invoice_id: str) -> Subscription`:
      * Increment subscription's `consecutive_failures` by 1 (raise `ValueError` if invoice is already `"PAID"`).
      * Dunning rules: if `consecutive_failures >= 5`, set `sub.status = "SUSPENDED"`; else if `consecutive_failures >= 3`, set `sub.status = "PAST_DUE"`.
    + `get_customer_summary(sub_id: str) -> dict`:
      * Return `{"sub_id": sub.sub_id, "status": sub.status, "plan_id": sub.plan_id, "seats": sub.seats, "credit_balance_cents": sub.credit_balance_cents, "open_invoices_cents": sum(inv.amount_due_cents for inv in invoices if inv.status == "OPEN"), "paid_invoices_count": sum(1 for inv in invoices if inv.status == "PAID")}`.

  ## Acceptance Criteria (Must Pass All Edge Cases)
  - AC-1: `register_plan` and `create_subscription` must reject empty IDs, negative prices, or `seats <= 0` with `ValueError`.
  - AC-2: `change_plan_prorated` must reject `seats <= 0`, `total_days_in_cycle <= 0`, `days_remaining < 0`, `days_remaining > total_days_in_cycle`, or `sub.status == "SUSPENDED"` with `ValueError`.
  - AC-3: Downgrading a plan mid-cycle must credit `abs(delta)` to `sub.credit_balance_cents`, and the next `generate_invoice` must automatically consume that credit up to the invoice gross total.
  - AC-4: `generate_invoice` must reject `extra_charge_cents < 0`, `discount_bps < 0`, `discount_bps > 10_000`, or `tax_bps < 0` with `ValueError`, and auto-mark 0-due invoices as `"PAID"`.
  - AC-5: `record_failed_payment` must transition subscription status to `"PAST_DUE"` on the 3rd consecutive failure and `"SUSPENDED"` on the 5th consecutive failure, while `record_payment` must be idempotent on `tx_id` and restore `"ACTIVE"` status with `consecutive_failures = 0`.
  - AC-6: Existing platform services (`auth`, `analytics`, `currency`) must remain 100% intact.
