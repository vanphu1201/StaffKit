  "src/analytics/__init__.py": ""
  "src/analytics/metrics.py": |
    def compute_mrr_cents(subscriptions: list[tuple[int, int, int]]) -> int:
        return sum(base + per_seat * seats for base, per_seat, seats in subscriptions)

    def compute_net_retention_bps(starting_mrr: int, ending_mrr: int) -> int:
        if starting_mrr <= 0:
            return 0
        return (ending_mrr * 10_000) // starting_mrr
  "src/repositories/__init__.py": ""
  "src/repositories/ledger_repo.py": |
    from src.models.subscription import Invoice, PlanTier, Subscription

    class LedgerRepository:
        def __init__(self) -> None:
            self._plans: dict[str, PlanTier] = {}
            self._subs: dict[str, Subscription] = {}
            self._invoices: dict[str, Invoice] = {}

        def save_plan(self, plan: PlanTier) -> None:
            self._plans[plan.plan_id] = plan

        def get_plan(self, plan_id: str) -> PlanTier | None:
            return self._plans.get(plan_id)

        def save_subscription(self, sub: Subscription) -> None:
            self._subs[sub.sub_id] = sub

        def get_subscription(self, sub_id: str) -> Subscription | None:
            return self._subs.get(sub_id)

        def save_invoice(self, invoice: Invoice) -> None:
            self._invoices[invoice.invoice_id] = invoice

        def get_invoice(self, invoice_id: str) -> Invoice | None:
            return self._invoices.get(invoice_id)

        def list_invoices_for_sub(self, sub_id: str) -> list[Invoice]:
            return [inv for inv in self._invoices.values() if inv.sub_id == sub_id]
