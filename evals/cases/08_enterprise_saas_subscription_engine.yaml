    from src.models.audit import AuditEntry

    class AuditLogger:
        def __init__(self) -> None:
            self._entries: list[AuditEntry] = []

        def record(self, actor_id: str, action: str, resource_id: str) -> AuditEntry:
            entry = AuditEntry(actor_id=actor_id, action=action, resource_id=resource_id)
            self._entries.append(entry)
            return entry

        def list_for_resource(self, resource_id: str) -> list[AuditEntry]:
            return [e for e in self._entries if e.resource_id == resource_id]
