hidden_files:
  "hidden_tests/test_hidden_subscription_acceptance.py": |
    import pytest
    from src.services.subscription_service import SubscriptionService

    def _setup_service() -> SubscriptionService:
        svc = SubscriptionService()
        svc.register_plan("STARTER", base_price_cents=2000, per_seat_cents=500)
        svc.register_plan("ENTERPRISE", base_price_cents=10000, per_seat_cents=1500)
        return svc

    def test_ac1_plan_and_subscription_validation() -> None:
        svc = _setup_service()
        with pytest.raises(ValueError):
            svc.register_plan("", 1000, 100)
        with pytest.raises(ValueError):
            svc.register_plan("BAD", -10, 100)
        with pytest.raises(ValueError):
            svc.create_subscription("SUB-1", "CUST-1", "UNKNOWN_PLAN", 5)
        with pytest.raises(ValueError):
            svc.create_subscription("SUB-1", "CUST-1", "STARTER", 0)

    def test_ac2_proration_upgrade_and_boundary_validation() -> None:
        svc = _setup_service()
        svc.create_subscription("SUB-1", "CUST-1", "STARTER", seats=4)  # old cost = 2000 + 2000 = 4000
        # Upgrade to ENTERPRISE with 6 seats (new cost = 10000 + 9000 = 19000), 15/30 days left -> +7500
        delta = svc.change_plan_prorated("SUB-1", "ENTERPRISE", new_seats=6, days_remaining=15, total_days_in_cycle=30)
        assert delta == 7500
        with pytest.raises(ValueError):
            svc.change_plan_prorated("SUB-1", "ENTERPRISE", new_seats=6, days_remaining=35, total_days_in_cycle=30)
        with pytest.raises(ValueError):
            svc.change_plan_prorated("SUB-1", "ENTERPRISE", new_seats=0, days_remaining=10, total_days_in_cycle=30)

    def test_ac3_downgrade_credit_automatically_applied_to_next_invoice() -> None:
        svc = _setup_service()
        svc.create_subscription("SUB-1", "CUST-1", "ENTERPRISE", seats=4)  # cost = 16000
        # Downgrade to STARTER with 2 seats (cost = 3000) with 15/30 days remaining -> delta = -6500
        delta = svc.change_plan_prorated("SUB-1", "STARTER", new_seats=2, days_remaining=15, total_days_in_cycle=30)
        assert delta == -6500
        sub = svc.repo.get_subscription("SUB-1")
        assert sub is not None and sub.credit_balance_cents == 6500

        # Next invoice on STARTER (3000 cents) should be completely covered by credit -> PAID, remaining credit 3500
        inv1 = svc.generate_invoice("INV-1", "SUB-1")
        assert inv1.credit_applied_cents == 3000
        assert inv1.amount_due_cents == 0
        assert inv1.status == "PAID"
        assert svc.repo.get_subscription("SUB-1").credit_balance_cents == 3500

    def test_ac4_invoice_discount_tax_and_validation() -> None:
        svc = _setup_service()
        svc.create_subscription("SUB-1", "CUST-1", "STARTER", seats=6)  # base 2000 + 3000 = 5000
        # extra 1000 -> subtotal 6000; 10% discount (1000 bps) -> 600 discount, taxable 5400; 8% tax (800 bps) -> 432
        inv = svc.generate_invoice("INV-10", "SUB-1", extra_charge_cents=1000, discount_bps=1000, tax_bps=800)
        assert inv.subtotal_cents == 6000
        assert inv.discount_cents == 600
        assert inv.tax_cents == 432
        assert inv.amount_due_cents == 5832
        assert inv.status == "OPEN"

        with pytest.raises(ValueError):
            svc.generate_invoice("INV-BAD", "SUB-1", discount_bps=12000)

    def test_ac5_dunning_state_machine_and_idempotent_payment_recovery() -> None:
        svc = _setup_service()
        svc.create_subscription("SUB-1", "CUST-1", "STARTER", seats=2)
        inv = svc.generate_invoice("INV-1", "SUB-1")
        assert inv.status == "OPEN"

        # 3 failures -> PAST_DUE
        svc.record_failed_payment("INV-1")
        svc.record_failed_payment("INV-1")
        sub = svc.record_failed_payment("INV-1")
        assert sub.status == "PAST_DUE"
        assert sub.consecutive_failures == 3

        # 5 failures -> SUSPENDED
        svc.record_failed_payment("INV-1")
        sub = svc.record_failed_payment("INV-1")
        assert sub.status == "SUSPENDED"
        assert sub.consecutive_failures == 5

        # Suspended subscription cannot change plan
        with pytest.raises(ValueError):
            svc.change_plan_prorated("SUB-1", "ENTERPRISE", 4, days_remaining=10)

        # Payment restores ACTIVE and is idempotent on tx_id
        paid_inv = svc.record_payment("INV-1", "TX-999")
        assert paid_inv.status == "PAID"
        assert paid_inv.paid_tx_ids == ["TX-999"]
        paid_again = svc.record_payment("INV-1", "TX-999")
        assert paid_again.paid_tx_ids == ["TX-999"]

        sub_after = svc.repo.get_subscription("SUB-1")
        assert sub_after.status == "ACTIVE"
        assert sub_after.consecutive_failures == 0

    def test_ac6_customer_summary_aggregation() -> None:
        svc = _setup_service()
        svc.create_subscription("SUB-1", "CUST-1", "STARTER", seats=2)  # 3000/cycle
        svc.generate_invoice("INV-1", "SUB-1")
        svc.record_payment("INV-1", "TX-1")
        svc.generate_invoice("INV-2", "SUB-1", extra_charge_cents=500)
        summary = svc.get_customer_summary("SUB-1")
        assert summary["sub_id"] == "SUB-1"
        assert summary["status"] == "ACTIVE"
        assert summary["open_invoices_cents"] == 3500
        assert summary["paid_invoices_count"] == 1
