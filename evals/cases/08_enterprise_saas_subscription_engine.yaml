    from src.analytics.metrics import compute_mrr_cents, compute_net_retention_bps
    from src.auth.token_guard import sign_session_token, verify_session_token
    from src.utils.currency import format_usd_cents

    def test_platform_helpers_regression() -> None:
        tok = sign_session_token("u1", "sec")
        assert verify_session_token(tok, "u1", "sec") is True
        assert format_usd_cents(1250) == "$12.50"
        assert compute_mrr_cents([(1000, 200, 5)]) == 2000
        assert compute_net_retention_bps(2000, 2500) == 12500
