id: eval-multi-file-pricing
title: "Multi-File Order Pricing & Invoicing (Protected Existing Currency Module)"
domain: business_logic
blueprint: python_app
prd_markdown: |
  Extend `src/pricing.py` and `src/invoice.py` while keeping `src/currency.py` and `tests/test_currency.py` strictly unchanged:
  1. Reuse `round_money` and `validate_currency` from `src/currency.py`.
  2. In `src/pricing.py`:
     - `calculate_line_total(unit_price: Decimal | str, quantity: int, discount_pct: Decimal | str = "0") -> Decimal`:
       + Validate `quantity > 0`, `unit_price >= 0`, `0 <= discount_pct <= 100` (`ValueError` otherwise).
       + Apply percentage discount and round half-up to 2 decimal places using `round_money`.
  3. In `src/invoice.py`:
     - `build_invoice(items: list[dict], tax_rate_pct: Decimal | str = "0", order_discount_pct: Decimal | str = "0", currency: str = "USD") -> dict`:
       + Validate currency via `validate_currency(currency)`.
       + Compute each item's `line_total` via `calculate_line_total`.
       + Sum into `subtotal`, apply `order_discount_pct` (`discount_amount`), compute `taxable_subtotal = subtotal - discount_amount`, then compute `tax_amount` using `tax_rate_pct`, and `grand_total = round_money(taxable_subtotal + tax_amount)`.
       + Return `{"currency", "items", "subtotal", "discount_amount", "tax_amount", "grand_total"}` with all monetary values rounded to `Decimal("0.01")`.
starter_files:
  "src/__init__.py": ""
  "src/currency.py": |
    """Protected shared currency rounding utilities."""

    from decimal import Decimal, ROUND_HALF_UP

    SUPPORTED_CURRENCIES = {"USD", "EUR", "VND"}


    def round_money(amount: Decimal | str | int) -> Decimal:
        return Decimal(str(amount)).quantize(Decimal("0.01"), rounding=ROUND_HALF_UP)


    def validate_currency(code: str) -> str:
        norm = code.strip().upper()
        if norm not in SUPPORTED_CURRENCIES:
            raise ValueError(f"Unsupported currency: {code}")
        return norm
  "src/pricing.py": |
    """Line-item pricing rules."""
  "src/invoice.py": |
    """Invoice builder aggregating priced items, discounts, and tax."""
  "tests/test_currency.py": |
    from decimal import Decimal
    import pytest
    from src.currency import round_money, validate_currency

    def test_currency_helpers() -> None:
        assert round_money("10.005") == Decimal("10.01")
        assert validate_currency("usd") == "USD"
        with pytest.raises(ValueError):
            validate_currency("XXX")
public_verify_commands:
  - "{python} -m pytest tests/test_currency.py -q"
hidden_files:
  "hidden_tests/test_hidden_invoice.py": |
    from decimal import Decimal
    import pytest
    from src.pricing import calculate_line_total
    from src.invoice import build_invoice

    def test_pricing_and_invoice_precision() -> None:
        assert calculate_line_total("19.99", 3, "10") == Decimal("53.97")
        with pytest.raises(ValueError):
            calculate_line_total("10.00", 0)
        with pytest.raises(ValueError):
            calculate_line_total("10.00", 1, "120")

        inv = build_invoice(
            items=[
                {"name": "Jacket", "unit_price": "120.00", "quantity": 2, "discount_pct": "10"},
                {"name": "Cap", "unit_price": "25.55", "quantity": 1, "discount_pct": "0"},
            ],
            tax_rate_pct="8",
            order_discount_pct="5",
            currency="usd",
        )
        # Line 1: 240 * 0.9 = 216.00; Line 2: 25.55; Subtotal = 241.55
        # Order discount 5%: 241.55 * 0.05 = 12.0775 -> 12.08; Taxable = 229.47
        # Tax 8%: 229.47 * 0.08 = 18.3576 -> 18.36; Grand total = 247.83
        assert inv["currency"] == "USD"
        assert inv["subtotal"] == Decimal("241.55")
        assert inv["discount_amount"] == Decimal("12.08")
        assert inv["tax_amount"] == Decimal("18.36")
        assert inv["grand_total"] == Decimal("247.83")

        with pytest.raises(ValueError):
            build_invoice(items=[], currency="BAD")
hidden_pass_to_pass_commands:
  - "{python} -m pytest tests/test_currency.py -q"
hidden_fail_to_pass_commands:
  - "{python} -m pytest hidden_tests/test_hidden_invoice.py -q"
