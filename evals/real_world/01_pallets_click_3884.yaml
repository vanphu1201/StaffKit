id: real-click-3884
title: 'pallets/click#3884: Fix `show_envvar` output for a sequence or an empty `envvar`'
domain: open_source_python_cli
blueprint: python_app
repo_url: https://github.com/pallets/click.git
base_commit: bb695aaecdef95832d167fc1d508921745aa824e
env:
  PYTHONPATH: src
prd_markdown: |-
  This PR fixes some awkward rendering in the `Error: Invalid value for '--units' (env var: xxxxx)` error message's hint for special cases of environment variables:

  | Parameter value | Hint before | Hint after |
  | --- | --- | --- |
  | `envvar=None` | Nothing | Nothing |
  | `envvar=""` | `(env var: '')` | Nothing |
  | `envvar=[]` | `(env var: '[]')` | Nothing |
  | `envvar=["WEATHER_UNITS", "UNITS"]` | `(env var: '['WEATHER_UNITS', 'UNITS']')` | `(env var: 'WEATHER_UNITS', 'UNITS')` |

  Also fixes the rendering of help screen:
  | Parameter value | Help screen before | Help screen after |
  | --- | --- | --- |
  | `envvar=None` | Nothing | Nothing |
  | `envvar=""` | `[env var: ]` | Nothing |
  | `envvar=[]` | `[env var: ]` | Nothing |
public_verify_commands:
- '{python} -m pytest -p no:asyncio tests/test_options.py -k "test_show_envvar or test_missing_envvar"
  -q'
hidden_patch: "diff --git a/tests/test_options.py b/tests/test_options.py\n--- a/tests/test_options.py\n\
  +++ b/tests/test_options.py\n@@ -875,6 +875,23 @@ def foo_bar(baz):\n     assert\
  \ \"TEST_FOO_BAR_BAZ\" in result.output\n \n \n+@pytest.mark.parametrize(\"envvar\"\
  , [None, [], \"\"])\n+@pytest.mark.parametrize(\n+    (\"auto_envvar_prefix\", \"\
  expected\"),\n+    [\n+        (None, \"  --units TEXT\\n\"),\n+        (\"WEATHER\"\
  , \"  --units TEXT  [env var: WEATHER_UNITS]\\n\"),\n+    ],\n+)\n+def test_show_envvar_empty(runner,\
  \ envvar, auto_envvar_prefix, expected):\n+    \"\"\"An empty ``envvar`` shows the\
  \ same help as no ``envvar``.\"\"\"\n+    option = click.Option([\"--units\"], envvar=envvar,\
  \ show_envvar=True)\n+    cli = click.Command(\"cli\", params=[option])\n+    result\
  \ = runner.invoke(cli, [\"--help\"], auto_envvar_prefix=auto_envvar_prefix)\n+ \
  \   assert not result.exception\n+    assert expected in result.output\n+\n+\n def\
  \ test_custom_validation(runner):\n     def validate_pos_int(ctx, param, value):\n\
  \         if value < 0:\n@@ -1018,6 +1035,25 @@ def test_missing_envvar(runner):\n\
  \     assert \"Error: Missing option '--foo'.\" in result.output\n \n \n+@pytest.mark.parametrize(\n\
  +    (\"envvar\", \"expected\"),\n+    [\n+        (\"UNITS\", \"'--units' (env\
  \ var: 'UNITS')\"),\n+        ([\"UNITS\"], \"'--units' (env var: 'UNITS')\"),\n\
  +        ([\"WEATHER_UNITS\", \"UNITS\"], \"'--units' (env var: 'WEATHER_UNITS',\
  \ 'UNITS')\"),\n+        ((\"WEATHER_UNITS\", \"UNITS\"), \"'--units' (env var:\
  \ 'WEATHER_UNITS', 'UNITS')\"),\n+        ([], \"'--units'\"),\n+        (\"\",\
  \ \"'--units'\"),\n+    ],\n+)\n+def test_missing_envvar_sequence(runner, envvar,\
  \ expected):\n+    \"\"\"The error hint names each variable of a sequence ``envvar``.\"\
  \"\"\n+    option = click.Option([\"--units\"], envvar=envvar, show_envvar=True,\
  \ required=True)\n+    result = runner.invoke(click.Command(\"cli\", params=[option]))\n\
  +    assert result.exit_code == 2\n+    assert f\"Error: Missing option {expected}.\"\
  \ in result.output\n+\n+\n def test_case_insensitive_choice(runner):\n     @click.command()\n\
  \     @click.option(\"--foo\", type=click.Choice([\"Orange\", \"Apple\"], case_sensitive=False))\n"
hidden_pass_to_pass_commands:
- '{python} -m pytest -p no:asyncio tests/test_options.py -k "not test_show_envvar_empty and not
  test_missing_envvar_sequence" -q'
hidden_fail_to_pass_commands:
- '{python} -m pytest -p no:asyncio tests/test_options.py -k "test_show_envvar_empty or test_missing_envvar_sequence"
  -q'
