id: real-rich-3180
title: 'Textualize/rich#3180: Fix double-width characters disappearing when wrapping'
domain: open_source_terminal_rendering
blueprint: python_app
repo_url: https://github.com/Textualize/rich.git
base_commit: b32e42bda00c6275d4e18dcbe298268094359549
env:
  PYTHONPATH: .
prd_markdown: |-
  Update wrapping logic to fix issues with CJK double-width characters disappearing when the fold location sits within a double-width character (also ensuring proper folding of long words across multiple lines followed by other words, leading/trailing whitespace, and consecutive spaces).

  Retain browser wrapping semantics:
  > if there is no space on the current line, move to a new line, and if there is not enough space on the entire new line, fold the text over multiple lines at appropriate locations.
public_verify_commands:
- '{python} -m pytest tests/test_text.py -k "wrap" -q'
hidden_patch: "diff --git a/tests/test_text.py b/tests/test_text.py\n--- a/tests/test_text.py\n\
  +++ b/tests/test_text.py\n@@ -449,6 +449,20 @@ def test_wrap_cjk_width_mid_character():\n\
  \     ]\n \n \n+def test_wrap_cjk_mixed():\n+    \"\"\"Regression test covering\
  \ https://github.com/Textualize/rich/issues/3176 and\n+    https://github.com/Textualize/textual/issues/3567\
  \ - double width characters could\n+    result in text going missing when wrapping.\"\
  \"\"\n+    text = Text(\"123ありがとうございました\")\n+    console = Console(width=20)  #\
  \ let's ensure the width passed to wrap() wins.\n+\n+    wrapped_lines = text.wrap(console,\
  \ width=8)\n+    with console.capture() as capture:\n+        console.print(wrapped_lines)\n\
  +\n+    assert capture.get() == \"123あり\\nがとうご\\nざいまし\\nた\\n\"\n+\n+\n def test_wrap_long():\n\
  \     text = Text(\"abracadabra\", justify=\"left\")\n     lines = text.wrap(Console(),\
  \ 4)\n@@ -497,6 +511,47 @@ def test_wrap_long_words_2():\n     ]\n \n \n+def test_wrap_long_words_followed_by_other_words():\n\
  +    \"\"\"After folding a word across multiple lines, we should continue from\n\
  +    the next word immediately after the folded word (don't take a newline\n+  \
  \  following completion of the folded word).\"\"\"\n+    text = Text(\"123 12345678\
  \ 123 123\")\n+    lines = text.wrap(Console(), 6)\n+    assert lines._lines ==\
  \ [\n+        Text(\"123 \"),\n+        Text(\"123456\"),\n+        Text(\"78 123\"\
  ),\n+        Text(\"123\"),\n+    ]\n+\n+\n+def test_wrap_long_word_preceeded_by_word_of_full_line_length():\n\
  +    \"\"\"The width of the first word is the same as the available width.\n+  \
  \  Ensures that folding works correctly when there's no space available\n+    on\
  \ the current line.\"\"\"\n+    text = Text(\"123456 12345678 123 123\")\n+    lines\
  \ = text.wrap(Console(), 6)\n+    assert lines._lines == [\n+        Text(\"123456\"\
  ),\n+        Text(\"123456\"),\n+        Text(\"78 123\"),\n+        Text(\"123\"\
  ),\n+    ]\n+\n+\n+def test_wrap_multiple_consecutive_spaces():\n+    \"\"\"Adding\
  \ multiple consecutive spaces at the end of a line does not impact\n+    the location\
  \ at which a break will be added during the process of wrapping.\"\"\"\n+    text\
  \ = Text(\"123456    12345678 123 123\")\n+    lines = text.wrap(Console(), 6)\n\
  +    assert lines._lines == [\n+        Text(\"123456\"),\n+        Text(\"123456\"\
  ),\n+        Text(\"78 123\"),\n+        Text(\"123\"),\n+    ]\n+\n+\n def test_wrap_long_words_justify_left():\n\
  \     text = Text(\"X 123456789\", justify=\"left\")\n     lines = text.wrap(Console(),\
  \ 4)\n@@ -508,6 +563,17 @@ def test_wrap_long_words_justify_left():\n     assert\
  \ lines[3] == Text(\"9   \")\n \n \n+def test_wrap_leading_and_trailing_whitespace():\n\
  +    text = Text(\"   123  456 789   \")\n+    lines = text.wrap(Console(), 4)\n\
  +    assert lines._lines == [\n+        Text(\"   1\"),\n+        Text(\"23  \"\
  ),\n+        Text(\"456 \"),\n+        Text(\"789 \"),\n+    ]\n+\n+\n def test_no_wrap_no_crop():\n\
  \     text = Text(\"Hello World!\" * 3)\n \n"
hidden_pass_to_pass_commands:
- '{python} -m pytest tests/test_text.py -k "not test_wrap_cjk_mixed and not test_wrap_long_words_followed_by_other_words
  and not test_wrap_long_word_preceeded_by_word_of_full_line_length and not test_wrap_multiple_consecutive_spaces
  and not test_wrap_leading_and_trailing_whitespace" -q'
hidden_fail_to_pass_commands:
- '{python} -m pytest tests/test_text.py -k "test_wrap_cjk_mixed or test_wrap_long_words_followed_by_other_words
  or test_wrap_long_word_preceeded_by_word_of_full_line_length or test_wrap_multiple_consecutive_spaces
  or test_wrap_leading_and_trailing_whitespace" -q'
